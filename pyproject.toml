[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcritic"
version = "0.3.0"
description = "Graph-based critic targets with closed-loop travel-time bridges"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["graphcritic"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
